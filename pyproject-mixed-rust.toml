# either add or substitute the revelant sections in pyproject.toml
# put rust code under `src` dir, python code under `python`
[build-system]
requires = ["maturin>=1.3,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
strip = true
profile = "release"
manifest-path = "Cargo.toml"
frozen = false
locked = false
config = []
unstable-flags = []
rustc-args = []
bindings = "pyo3"
python-source = "python"
sdist-generator = "cargo"
python-packages = ["asap_o_matic"]
module_name = "asap_o_matic._asap_o_matic"